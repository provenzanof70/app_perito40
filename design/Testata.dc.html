<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:200},&quot;titolo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Beni&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;codice&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;indietro&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Pratiche&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;offline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;contatori&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;evidenze&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:47,&quot;tsType&quot;:&quot;number&quot;},&quot;azioni&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;tsType&quot;:&quot;number&quot;}}">

  renderVals() {
    const p = this.props, d = !!p.dark;

      ? { bg:'#000', tx:'#F2F2F7', t2:'#98989F', ac:'#5A9BFF', acT:'#1A2B44', card:'#1C1C1E', offBg:'#2C2C2E', offFg:'#AEAEB2' }
